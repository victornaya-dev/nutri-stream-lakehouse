name: Deploy Infrastructure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Zip Lambda
        run: |
          cd src
          zip lambda_transform.zip lambda_transform.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      # - name: Check backend bucket (debug only)
      #   run: aws s3 ls s3://food-facts-raw-victor --region eu-west-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: cd terraform && terraform init -backend-config="region=${{ secrets.AWS_REGION }}" 

      - name: Terraform Import existing resources
        run: |
          cd terraform
          terraform import aws_iam_role.glue_role AWSGlueServiceRole-food-facts || true
          terraform import aws_iam_role.firehose_role firehose-food-facts-role || true
          terraform import aws_iam_role.lambda_role food-facts-transform-role-mnn2m10u || true
          terraform import aws_kinesis_stream.main "arn:aws:kinesis:${AWS_REGION}:${AWS_ACCOUNT_ID}:stream/food-facts-stream" || true
          terraform import aws_s3_bucket.raw ${{ secrets.BUCKET_RAW }} || true
          terraform import aws_s3_bucket.processed ${{ secrets.BUCKET_PROCESSED }} || true
          terraform import aws_glue_catalog_database.food_facts ${{ secrets.AWS_ACCOUNT_ID }}:food_facts_db || true
          terraform import aws_glue_crawler.json_crawler food-facts-crawler || true
          terraform import aws_glue_crawler.parquet_crawler food-facts-parquet-crawler || true
          terraform import aws_glue_job.etl food-facts-etl || true
          terraform import aws_lambda_function.transform food-facts-transform || true
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_kinesis_stream_arn: ${{ secrets.KINESIS_STREAM_ARN }}
          TF_VAR_firehose_role_arn: ${{ secrets.FIREHOSE_ROLE_ARN }}
          TF_VAR_bucket_raw: ${{ secrets.BUCKET_RAW }}
          TF_VAR_bucket_processed: ${{ secrets.BUCKET_PROCESSED }}

      - name: Debug state
        run: cd terraform && terraform state list || echo "state empty"
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_kinesis_stream_arn: ${{ secrets.KINESIS_STREAM_ARN }}
          TF_VAR_firehose_role_arn: ${{ secrets.FIREHOSE_ROLE_ARN }}
          TF_VAR_bucket_raw: ${{ secrets.BUCKET_RAW }}
          TF_VAR_bucket_processed: ${{ secrets.BUCKET_PROCESSED }}

      - name: Terraform Apply
        run: cd terraform && terraform apply -auto-approve
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_kinesis_stream_arn: ${{ secrets.KINESIS_STREAM_ARN }}
          TF_VAR_firehose_role_arn: ${{ secrets.FIREHOSE_ROLE_ARN }}
          TF_VAR_bucket_raw: ${{ secrets.BUCKET_RAW }}
          TF_VAR_bucket_processed: ${{ secrets.BUCKET_PROCESSED }}

