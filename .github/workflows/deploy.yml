name: Deploy Infrastructure

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Zip Lambda
        run: |
          cd src
          zip lambda_transform.zip lambda_transform.py

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Init
        run: cd terraform && terraform init -backend-config="region=${{ secrets.AWS_REGION }}" 

      - name: Terraform Apply
        run: cd terraform && terraform apply -auto-approve
        env:
          TF_VAR_aws_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
          TF_VAR_kinesis_stream_arn: ${{ secrets.KINESIS_STREAM_ARN }}
          TF_VAR_firehose_role_arn: ${{ secrets.FIREHOSE_ROLE_ARN }}
          TF_VAR_bucket_raw: ${{ secrets.BUCKET_RAW }}
          TF_VAR_bucket_processed: ${{ secrets.BUCKET_PROCESSED }}